<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kam + Claude HQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --blue: #3b82f6;
      --green: #22c55e;
      --yellow: #eab308;
      --purple: #a855f7;
      --pink: #ec4899;
      --orange: #f97316;
    }
    
    body {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 32px;
    }
    
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .logo span { color: var(--blue); }
    
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    
    /* Bento Grid */
    .bento {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
    }
    
    .card-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    
    /* Focus - spans full width */
    .focus {
      grid-column: span 12;
      background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
      color: white;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    
    .focus .card-title { color: rgba(255,255,255,0.7); }
    
    .focus-week {
      font-size: 2rem;
      font-weight: 700;
      white-space: nowrap;
    }
    
    .focus-items {
      flex: 1;
    }
    
    .focus-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    
    .focus-item:before {
      content: "→";
      opacity: 0.7;
    }
    
    /* Claude's Thoughts */
    .thoughts {
      grid-column: span 8;
    }
    
    .thought {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .thought:last-child { border-bottom: none; }
    
    .thought-type {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }
    
    .thought-type.recommendation { background: #dbeafe; color: var(--blue); }
    .thought-type.question { background: #fef3c7; color: #b45309; }
    .thought-type.idea { background: #f3e8ff; color: var(--purple); }
    
    .thought-text {
      font-size: 0.9rem;
      line-height: 1.5;
    }
    
    /* Projects */
    .projects {
      grid-column: span 4;
    }
    
    .project {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .project:last-child { border-bottom: none; }
    
    .project-emoji {
      font-size: 1.25rem;
    }
    
    .project-info {
      flex: 1;
      min-width: 0;
    }
    
    .project-name {
      font-weight: 600;
      font-size: 0.85rem;
    }
    
    .project-link {
      display: block;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s;
    }
    
    .project-link:hover {
      transform: translateX(4px);
    }
    
    .project-link:hover .project-name {
      color: var(--blue);
    }
    
    .project-note {
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .project-status {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    
    .status-green { background: #dcfce7; color: #166534; }
    .status-yellow { background: #fef9c3; color: #854d0e; }
    .status-purple { background: #f3e8ff; color: #7c3aed; }
    .status-blue { background: #dbeafe; color: #1d4ed8; }
    
    /* Idea Bank */
    .ideas {
      grid-column: span 6;
    }
    
    .idea-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    
    .idea {
      background: var(--bg);
      padding: 12px;
      border-radius: 10px;
    }
    
    .idea-name {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }
    
    .idea-liner {
      font-size: 0.75rem;
      color: var(--muted);
    }
    
    .idea-tag {
      display: inline-block;
      font-size: 0.6rem;
      padding: 2px 5px;
      border-radius: 3px;
      margin-top: 6px;
    }
    
    .tag-fresh { background: var(--green); color: white; }
    .tag-backlog { background: var(--muted); color: white; }
    
    /* Recent Work */
    .recent {
      grid-column: span 6;
    }
    
    .work-item {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      font-size: 0.85rem;
    }
    
    .work-date {
      color: var(--blue);
      font-weight: 600;
      white-space: nowrap;
      min-width: 50px;
    }
    
    /* Links */
    .links-row {
      grid-column: span 12;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    
    .link-btn:hover {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }
    
    /* Footer */
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    
    .footer a {
      color: var(--blue);
      text-decoration: none;
    }
    
    /* Mobile */
    @media (max-width: 768px) {
      .bento { gap: 12px; }
      .card { padding: 16px; }
      
      .focus {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      
      .focus-week { font-size: 1.5rem; }
      
      .thoughts, .projects, .ideas, .recent { grid-column: span 12; }
      
      .idea-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">Kam <span>×</span> Claude</div>
      <div class="meta" id="lastUpdated"></div>
    </header>
    
    <div class="bento">
      <!-- Focus -->
      <div class="card focus" id="focus"></div>
      
      <!-- Claude's Thoughts -->
      <div class="card thoughts">
        <div class="card-title">💭 Claude's Thoughts</div>
        <div id="thoughts"></div>
      </div>
      
      <!-- Projects -->
      <div class="card projects">
        <div class="card-title">📦 Projects</div>
        <div id="projects"></div>
      </div>
      
      <!-- Idea Bank -->
      <div class="card ideas">
        <div class="card-title">💡 Idea Bank</div>
        <div class="idea-grid" id="ideas"></div>
      </div>
      
      <!-- Recent Work -->
      <div class="card recent">
        <div class="card-title">⚡ Recent</div>
        <div id="recent"></div>
      </div>
      
      <!-- Links -->
      <div class="links-row" id="links"></div>
    </div>
    
    <footer class="footer">
      Chat continues on <a href="https://t.me/ClawdBot">Telegram</a> · Dashboard updates as we work
    </footer>
  </div>
  
  <script>
    async function load() {
      const res = await fetch('data.json?' + Date.now());
      const d = await res.json();
      
      document.getElementById('lastUpdated').textContent = 
        new Date(d.lastUpdated).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      
      // Focus
      document.getElementById('focus').innerHTML = `
        <div>
          <div class="card-title">${d.focus.title}</div>
          <div class="focus-week">${d.weekOf}</div>
        </div>
        <div class="focus-items">
          ${d.focus.items.map(i => `<div class="focus-item">${i}</div>`).join('')}
        </div>
      `;
      
      // Thoughts
      document.getElementById('thoughts').innerHTML = d.claudeSuggestions.items.map(t => `
        <div class="thought">
          <span class="thought-type ${t.type}">${t.type}</span>
          <div class="thought-text">${t.text}</div>
        </div>
      `).join('');
      
      // Projects
      document.getElementById('projects').innerHTML = d.projects.map(p => {
        const inner = `
          <span class="project-emoji">${p.emoji}</span>
          <div class="project-info">
            <div class="project-name">${p.name}</div>
            <div class="project-note">${p.note}</div>
          </div>
          <span class="project-status status-${p.statusColor}">${p.status}</span>
        `;
        return p.link 
          ? `<a href="${p.link}" class="project project-link">${inner}</a>`
          : `<div class="project">${inner}</div>`;
      }).join('');
      
      // Ideas
      document.getElementById('ideas').innerHTML = d.ideaBank.map(i => `
        <div class="idea">
          <div class="idea-name">${i.name}</div>
          <div class="idea-liner">${i.oneLiner}</div>
          <span class="idea-tag tag-${i.status}">${i.status}</span>
        </div>
      `).join('');
      
      // Recent
      document.getElementById('recent').innerHTML = d.recentWork.map(w => `
        <div class="work-item">
          <span class="work-date">${w.date}</span>
          <span>${w.what}</span>
        </div>
      `).join('');
      
      // Links
      document.getElementById('links').innerHTML = d.links.map(l => `
        <a href="${l.url}" class="link-btn" target="_blank">${l.name} →</a>
      `).join('');
    }
    
    load();
  </script>
</body>
</html>
